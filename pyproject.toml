[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    "data",
    "__pycache__",
    "*.before_coordinates.json",
    "app/main_backup.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long
]

[tool.ruff.lint.per-file-ignores]
"ui/app.py" = ["E402"]
